# Revenue Intelligence — local Postgres + Redis (repo root)
#   docker compose up -d
#   docker compose down      # keeps data
#   docker compose down -v   # wipes data

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: revenue_intel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: revenue_user
      POSTGRES_PASSWORD: revenue_pass
      POSTGRES_DB: revenue_intelligence
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenue_user -d revenue_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revenue_intel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: revenue_intel_meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=meili_master_key
    volumes:
      - meilisearch_data:/meili_data

  ai-services:
    build: ./boilerplate code/r-revenue-intelligence/apps/ai-services
    container_name: revenue_intel_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://revenue_user:revenue_pass@postgres:5432/revenue_intelligence?schema=public
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
    name: revenue_intel_pgdata
  meilisearch_data:
    name: revenue_intel_meili_data
