packages:
  - apps/*
  - packages/*
  - modules/*
  - apps/web/src/modules/m01-capture-transcription
  - apps/web/src/modules/m02-conversation-intelligence
  - apps/web/src/modules/m09-coaching-training
  - apps/web/src/modules/m03-ai-summaries-genai
  - apps/web/src/modules/m10-data-compliance
  - apps/web/src/modules/m05-account-intelligence
  - apps/web/src/modules/m07-revenue-dashboards

# pnpm 10+ reads catalog/overrides from this file (the "pnpm.overrides" field
# in package.json is no longer honoured). All Nest packages MUST resolve to a
# single instance — otherwise class-identity-based DI (ConfigService, etc.)
# silently injects `undefined` in modules whose local node_modules has a
# duplicate copy.
overrides:
  '@nestjs/core': '10.4.22'
  '@nestjs/common': '10.4.22'
  '@nestjs/config': '3.3.0'
  '@nestjs/event-emitter': '2.1.1'
  '@nestjs/jwt': '10.2.0'
  '@nestjs/passport': '11.0.5'
  '@nestjs/platform-express': '10.4.22'
  # CRITICAL: a single reflect-metadata is non-negotiable. Two copies create
  # two `Reflect.getMetadata` symbols, so Nest decorators write metadata on
  # one global while DI reads from the other → ConfigService etc. are
  # silently injected as `undefined`.
  'reflect-metadata': '0.2.2'

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - msgpackr-extract
  - prisma
  - unrs-resolver
